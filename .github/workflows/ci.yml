name: CI

on:
  push:
    branches: [teste-pleno, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # a newer push cancels an older pull request run, but never a run that may be deploying
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # unit, integration (Testcontainers), concurrency and architecture tests
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose (full stack smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # the same command the README asks for, with no .env file
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Check web app, API proxy, health and seed
        run: |
          set -euo pipefail
          curl -fsS http://localhost:4200/ | grep -q '<app-root'
          curl -fsS http://localhost:4200/requests/1 | grep -q '<app-root'
          curl -fsS http://localhost:4200/api/health | grep -q '"status":"UP"'
          curl -fsS -o /dev/null http://localhost:8080/swagger-ui/index.html
          token=$(curl -fsS -X POST http://localhost:4200/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"Senha@123"}' | jq -r .accessToken)
          curl -fsS http://localhost:4200/api/dashboard/summary -H "Authorization: Bearer $token" \
            | jq -e '.budgets | length == 2'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Continuous deployment (docs/deploy.md): only for a push to teste-pleno in this repository, after every check
  # above passed, and only once the server is ready (repository variable DEPLOY_ENABLED=true). Pull requests,
  # including those from forks, never reach these jobs.
  release:
    name: Release (arm64 images)
    needs: [backend, frontend, compose]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/teste-pleno' &&
      github.repository == 'seriikmota/developer-challenge' &&
      vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ github.sha }}

  deploy:
    name: Deploy
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
