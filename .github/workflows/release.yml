name: release

# Publishes the linux/arm64 images to GHCR (docs/deploy.md). Called by ci.yml after every check passed on a push
# to the deploy branch. The build stages run natively on the x86 runner (the jar and the web bundle are
# architecture independent); only the small runtime stages are arm64, under QEMU.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build and tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish arm64 images
    runs-on: ubuntu-latest
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Back-end image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-backend:${{ env.SHA }}
            ${{ steps.names.outputs.prefix }}-backend:latest
          # source links the GHCR package to this repository (visibility and Actions access follow it)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Front-end image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-frontend:${{ env.SHA }}
            ${{ steps.names.outputs.prefix }}-frontend:latest
          # source links the GHCR package to this repository (visibility and Actions access follow it)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
