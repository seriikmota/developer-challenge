spring:
  application:
    name: purchase-requests
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/purchase}
    username: ${DB_USERNAME:purchase}
    password: ${DB_PASSWORD:purchase}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
