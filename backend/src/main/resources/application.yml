spring:
  application:
    name: purchase-requests
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/purchase}
    username: ${DB_USERNAME:purchase}
    password: ${DB_PASSWORD:purchase}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  web:
    resources:
      # API only: no static files, so unknown paths become a 404 problem instead of a resource lookup
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
  endpoint:
    health:
      # component statuses (db: UP) are public; connection details are not
      show-components: always
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

app:
  security:
    jwt:
      # HS256 key, at least 32 bytes. Empty: a random key is generated at startup (tokens die on restart).
      secret: ${JWT_SECRET:}
      issuer: purchase-requests
      ttl: ${JWT_TTL:PT15M}
